name: RADOME 2026 CI

on:
  push:
    paths:
      - "radome-2026/**"
      - ".github/workflows/radome-2026-ci.yml"
  pull_request:
    paths:
      - "radome-2026/**"
      - ".github/workflows/radome-2026-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: radome-2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: radome-2026

      # Le spike ne versionne pas encore Cargo.lock. On laisse Cargo resoudre
      # les dependances ici afin d'atteindre la compilation et les vrais tests.
      # Une fois le lockfile genere et commite, ces commandes repasseront en --locked.
      - name: Check
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Test dashboard
        run: node --test clients/dashboard/*.test.mjs

      - name: Test client SDK
        run: node --test clients/sdk/*.test.mjs

      - name: Build live RADOME server
        if: matrix.os == 'ubuntu-latest'
        run: cargo build -p radome-server

      - name: Test live client end to end
        if: matrix.os == 'ubuntu-latest'
        run: node --test clients/sdk/radome-live.e2e.mjs

  vcan:
    name: SocketCAN vcan smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: radome-2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: radome-2026

      - name: Configure vcan0
        run: |
          sudo apt-get update
          sudo apt-get install -y can-utils

          # Les runners ubuntu-latest Azure peuvent démarrer avec le module
          # vcan absent de l'installation minimale du noyau. Tenter d'abord le
          # chargement normal, puis installer le paquet de modules du noyau
          # courant seulement si nécessaire.
          if ! sudo modprobe vcan; then
            kernel="$(uname -r)"
            modules_package="linux-modules-extra-${kernel}"
            echo "vcan absent; installation de ${modules_package}"
            sudo apt-get install -y "${modules_package}"
            sudo modprobe vcan
          fi

          sudo ip link del vcan0 2>/dev/null || true
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
          ip -details link show vcan0

      - name: Test real SocketCAN pipeline on vcan0
        env:
          RADOME_VCAN_INTERFACE: vcan0
        run: cargo test -p radome-server vcan_frame_reaches_runtime_and_hub_through_real_socketcan -- --nocapture
