<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RADOME Dashboard</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d10; color: #f5f7fa; }
    main { width: min(900px, 92vw); }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    h1 { letter-spacing: .18em; font-size: 1rem; }
    #status { font-size: .85rem; opacity: .8; }
    #status[data-state="connected"] { opacity: 1; }
    #status[data-state="error"] { font-weight: 700; }
    .cluster { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
    .gauge { padding: 2rem; border: 1px solid #303640; border-radius: 1rem; background: #12161c; text-align: center; }
    .value { font-size: clamp(4rem, 12vw, 8rem); font-variant-numeric: tabular-nums; line-height: 1; }
    .unit { margin-top: .75rem; opacity: .65; letter-spacing: .12em; }
    @media (max-width: 600px) { .cluster { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <header><h1>RADOME // DRIVER DISPLAY</h1><span id="status" data-state="disconnected">déconnecté</span></header>
  <section class="cluster" aria-label="État du véhicule">
    <article class="gauge"><div id="speed" class="value">--</div><div class="unit">KM/H</div></article>
    <article class="gauge"><div id="rpm" class="value">----</div><div class="unit">TR/MIN</div></article>
  </section>
</main>
<script type="module">
import { RadomeClient } from '../sdk/radome-client.js';
import { VehicleState } from './vehicle-state.js';
import { DashboardView } from './dashboard-view.js';

const wsUrl = new URLSearchParams(location.search).get('ws') ?? 'ws://127.0.0.1:8787';
const vehicle = new VehicleState();
const view = new DashboardView();
const client = new RadomeClient({
  url: wsUrl,
  clientId: 'dashboard-web',
  role: 'driver-display',
  capabilities: ['display', 'touch'],
});

vehicle.addEventListener('change', ({ detail }) => view.renderVehicle(detail));
client.on('status', status => view.renderStatus(status));
client.on('event:vehicle.speed_changed', data => vehicle.applyRadomeEvent('vehicle.speed_changed', data));
client.on('event:vehicle.engine_rpm_changed', data => vehicle.applyRadomeEvent('vehicle.engine_rpm_changed', data));
client.on('error', error => view.renderError(error));

view.renderVehicle(vehicle.snapshot);
client.connect();
</script>
</body>
</html>
