<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RADOME Dashboard</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d10; color: #f5f7fa; }
    main { width: min(900px, 92vw); }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    h1 { letter-spacing: .18em; font-size: 1rem; }
    #status { font-size: .85rem; opacity: .8; }
    .cluster { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
    .gauge { padding: 2rem; border: 1px solid #303640; border-radius: 1rem; background: #12161c; text-align: center; }
    .value { font-size: clamp(4rem, 12vw, 8rem); font-variant-numeric: tabular-nums; line-height: 1; }
    .unit { margin-top: .75rem; opacity: .65; letter-spacing: .12em; }
    @media (max-width: 600px) { .cluster { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <header><h1>RADOME // DRIVER DISPLAY</h1><span id="status">déconnecté</span></header>
  <section class="cluster">
    <article class="gauge"><div id="speed" class="value">--</div><div class="unit">KM/H</div></article>
    <article class="gauge"><div id="rpm" class="value">----</div><div class="unit">TR/MIN</div></article>
  </section>
</main>
<script>
const statusEl = document.querySelector('#status');
const speedEl = document.querySelector('#speed');
const rpmEl = document.querySelector('#rpm');
const wsUrl = new URLSearchParams(location.search).get('ws') ?? 'ws://127.0.0.1:8787';
let sessionId;
const ws = new WebSocket(wsUrl);

function envelope(id, messageType, payload, session_id) {
  return { protocol_version: 1, id, message_type: messageType, correlation_id: null, session_id: session_id ?? null, payload };
}
function send(value) { ws.send(JSON.stringify(value)); }

ws.addEventListener('open', () => {
  statusEl.textContent = 'connexion…';
  send(envelope('dashboard-hello', 'hello', { client_id: 'dashboard-web' }));
});

ws.addEventListener('message', ({ data }) => {
  const message = JSON.parse(data);
  if (message.message_type === 'hello') {
    sessionId = message.session_id;
    send(envelope('dashboard-capabilities', 'capability_announce', {
      role: 'driver-display', capabilities: ['display', 'touch']
    }, sessionId));
    return;
  }
  if (message.message_type === 'capability_announce' && message.payload.accepted) {
    statusEl.textContent = 'RADOME connecté';
    return;
  }
  if (message.message_type === 'event') {
    const value = String(message.payload.data).split('=')[1];
    if (message.payload.name === 'vehicle.speed_changed') speedEl.textContent = value;
    if (message.payload.name === 'vehicle.engine_rpm_changed') rpmEl.textContent = value;
  }
});

ws.addEventListener('close', () => { statusEl.textContent = 'déconnecté'; });
ws.addEventListener('error', () => { statusEl.textContent = 'erreur réseau'; });
</script>
</body>
</html>
